name: Build

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  module:
    runs-on: ubuntu-latest
    # A "Release NeoTEESim v…" commit is cut straight to a v* tag, which builds and publishes it.
    # Skip its redundant dev-push build entirely so the same code never builds (or canaries) twice.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev' && startsWith(github.event.head_commit.message, 'Release NeoTEESim v')) }}
    permissions:
      contents: write # publish canary prereleases and tagged releases
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so the commit-count version is correct

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build golang-go clang libclang-dev zip

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v4
      - name: Install NDK, CMake and build-tools
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36"

      # The whole build is driven by Gradle via the committed wrapper: AGP produces the control
      # daemon's dex and builds the native interceptors through externalNativeBuild (CMake), whose
      # AIDL is generated with the build-tools above.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          # Pinned for reproducibility. cargo-ndk 4 sets bindgen's NDK-sysroot clang args by default,
          # which rust/build.sh (openssl-sys bindgens BoringSSL) relies on.
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-${{ hashFiles('rust/**/Cargo.toml') }}

      # Enforce the TA's cast lints on the shipped target before building: capi's
      # KeyParameter conversion denies lossy integer casts (see #205), so a new
      # unguarded cast fails here rather than silently mis-encoding a tag.
      - name: Lint the KeyMint TA (clippy)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          rustup component add clippy
          ./rust/build.sh clippy

      - name: Build the module
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./gradlew zipRelease zipDebug

      # upload-artifact re-zips whatever it is given on download, so handing it the built module zip
      # yields a zip-of-a-zip that has to be unpacked twice before flashing. Unpack each variant and
      # upload its contents, so the downloaded artifact is a single, directly-flashable module. Release
      # and Debug go up as separate artifacts, each named after its build.
      - name: Stage the module artifacts
        id: artifacts
        run: |
          set -euo pipefail
          rel=$(ls out/NeoTEESim-*-Release.zip)
          dbg=$(ls out/NeoTEESim-*-Debug.zip)
          mkdir -p artifact-release artifact-debug
          unzip -q "$rel" -d artifact-release
          unzip -q "$dbg" -d artifact-debug
          echo "release=$(basename "$rel" .zip)" >> "$GITHUB_OUTPUT"
          echo "debug=$(basename "$dbg" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload the release module
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts.outputs.release }}
          path: artifact-release/*
          if-no-files-found: error

      - name: Upload the debug module
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts.outputs.debug }}
          path: artifact-debug/*
          if-no-files-found: error

      # --- stable release (pushed v* tag) --------------------------------------------------------
      #
      # `git tag vX && git push --tags` publishes the release here from the very zips this build
      # produced — nothing is hand-uploaded, so the assets can never drift from what was built.
      # The build stamps every zip with the commit hash for canary traceability; a tagged release is
      # named by its tag, so that hash is stripped from the asset names first, giving the exact zip
      # name module/update.json's zipUrl points at. The OTA descriptor (module/update.json) and the
      # changelog live in the repo and are served from the branch (raw.githubusercontent) — not
      # generated here — so this step only builds the release and uses the changelog as its body.
      # Bump module/update.json's version/versionCode/zipUrl to match the tag before tagging.
      - name: Publish release
        if: ${{ success() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Drop the -<hash> segment sitting before -Release/-Debug so the release assets read
          # NeoTEESim-<ver>-<count>-Release.zip, matching module/update.json's zipUrl.
          for z in out/NeoTEESim-*-Release.zip out/NeoTEESim-*-Debug.zip; do
            clean=$(echo "$z" | sed -E 's/-[0-9a-f]{7,}-(Release|Debug)\.zip$/-\1.zip/')
            [ "$z" = "$clean" ] || mv "$z" "$clean"
          done
          rel=$(ls out/NeoTEESim-*-Release.zip)
          dbg=$(ls out/NeoTEESim-*-Debug.zip)
          # `%s` argument, never the format string, so a `%` anywhere in the changelog stays literal.
          notes=$(printf '# NeoTEESim %s\n\n%s\n' "${TAG}" "$(cat module/changelog.md)")
          # Recreated rather than edited so a re-run replaces the assets instead of appending a second
          # copy. No --cleanup-tag: the release is rebuilt, the pushed release tag is kept.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --latest \
            --title "NeoTEESim ${TAG}" \
            --notes "$notes" \
            "$rel" "$dbg"

      # --- canary distribution (dev push) --------------------------------------------------------
      #
      # The zips are also attached to a rolling prerelease so testers (and the WebUI updater) can
      # download without a GitHub account: an Actions artifact 401s an anonymous caller, a release
      # asset does not. Marked prerelease so releases/latest keeps pointing at the last stable tag.
      # Release commits never reach here — the job-level `if` skips their dev build outright.
      - name: Publish canary prerelease
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/dev'))
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          code=$(git rev-list HEAD --count)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          tag="canary-${code}"
          notes=$(cat <<EOF
          **${subject}**

          Built from [\`${short}\`](${COMMIT_URL}) by [run ${{ github.run_id }}](${RUN_URL}).

          A canary — the current state of \`dev\`, tested by CI and nothing else, published as a
          prerelease so it can be downloaded (and flashed from the WebUI) without a GitHub account.

          | Build | Use it when |
          | :-- | :-- |
          | \`…-Debug.zip\` | Chasing a bug — far more logging. |
          | \`…-Release.zip\` | You just want the newest code. |

          Only the five most recent canaries are kept.
          EOF
          )
          # Recreate rather than edit so a re-run replaces the build instead of appending assets.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "NeoTEESim canary ${code}" \
            --notes "$notes" \
            out/NeoTEESim-*-Release.zip \
            out/NeoTEESim-*-Debug.zip

      # Five is enough to bisect a regression; sorted by version code (commit count, monotonic), not
      # date, which reruns and reverts can disorder.
      - name: Keep only the five most recent canaries
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/dev'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^canary-' || true)
          [ -n "$tags" ] || exit 0
          echo "$tags" | sort -t- -k2 -n -r | tail -n +6 | while read -r old; do
            echo "Removing $old"
            gh release delete "$old" --yes --cleanup-tag
          done

      # --- telegram distribution -------------------------------------------------------------------
      #
      # The same zips the release and canary steps just published go to the Telegram channel as one
      # media group, so testers can grab a build without a GitHub account. Placed last on purpose:
      # a tagged release has already stripped the commit hash from the asset names here, so what the
      # channel receives is named exactly what module/update.json's zipUrl points at.
      #
      # No `if` beyond the event filter: a pull_request build is a validation, not a distribution,
      # and a fork's pull request carries no secrets anyway - the guard below skips it either way.
      - name: Publish artifacts to Telegram
        if: github.event_name != 'pull_request'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # INFO: The bot exists only once its secrets do; until then this is
          #       a warning and the artifacts stay on the run page alone.
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping publish"
            exit 0
          fi

          zips=$(ls out/NeoTEESim-*-Release.zip out/NeoTEESim-*-Debug.zip 2>/dev/null || true)
          if [ -z "$zips" ]; then
            echo "::error::No build zips found in out/"
            exit 1
          fi

          escape_html() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"

          # INFO: The commit message quoted whole, the way the channel shows
          #       it, cut by characters (not bytes) and far enough ahead of
          #       Telegram's 1024-character caption limit that the escaping
          #       of the text below cannot push the caption over it.
          message=$(git log -1 --pretty=%B "$COMMIT_SHA" \
            | python3 -c "import sys; sys.stdout.write(sys.stdin.read().strip()[:600])" \
            | escape_html)

          echo "publishing from $(pwd)"
          ls -la out/

          # INFO: Every zip of the build travels as ONE media group - a single
          #       message, one caption on its first item, the shape a channel
          #       reader expects a build to arrive in.
          count=0
          doc_args=()
          for zip in $zips; do
            doc_args+=(-F "doc$count=@$GITHUB_WORKSPACE/$zip")
            count=$((count + 1))
          done

          # INFO: The media list is written to a file by the interpreter and
          #       handed to curl with the "read the value from this file"
          #       form, because an inline JSON in the form value does not
          #       survive the field parser - Telegram answered every inline
          #       attempt with "can't parse media JSON object", while the
          #       identical JSON through a file parses and ships.
          CAPTION="<b>NeoTEESim</b>"$'\n'"Run: #$RUN_NUMBER"$'\n\n'"<blockquote>$message</blockquote>"$'\n\n'"<a href=\"$COMMIT_URL\">Commit</a>"$'\n'"<a href=\"$RUN_URL\">Workflow run</a>" \
            python3 -c 'import json, sys, os; n = int(sys.argv[1]); m = [{"type": "document", "media": "attach://doc%d" % i} for i in range(n)]; m[-1]["caption"] = os.environ["CAPTION"]; m[-1]["parse_mode"] = "HTML"; open(sys.argv[2], "w").write(json.dumps(m))' "$count" "$GITHUB_WORKSPACE/tg_media.json"

          curl_args=(-sS -o tg_response.json -w '%{http_code}'
                     --form-string "chat_id=$TG_CHAT_ID"
                     -F 'media=<tg_media.json'
                     "${doc_args[@]}")

          if [ -n "$TG_THREAD_ID" ]; then
            curl_args+=(--form-string "message_thread_id=$TG_THREAD_ID")
          fi

          curl_args+=("https://api.telegram.org/bot$TG_BOT_TOKEN/sendMediaGroup")

          # INFO: A Telegram hiccup must not fail a build that already
          #       produced its artifacts: warn and keep the delivery to the
          #       next run instead of failing the build over it.
          http=$(curl "${curl_args[@]}" 2>curl_err.txt) || http="curl-failed"

          if [ "$http" != "200" ]; then
            echo "::warning::Telegram upload failed ($http)"
            [ -s curl_err.txt ] && echo "::warning::curl: $(cat curl_err.txt)"
            [ -s tg_response.json ] && echo "::warning::Telegram said: $(head -c 400 tg_response.json)"
          else
            echo "Sent $count zips as one media group: $(head -c 160 tg_response.json)"
          fi
